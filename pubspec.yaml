name: todo_app
description: "A secure cross-platform Todo application powered by Supabase and Flutter."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Supabase Client & Auth
  supabase_flutter: ^2.8.0

  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Routing & Navigation
  go_router: ^14.8.0

  # Configuration & Secrets
  flutter_dotenv: ^5.2.1

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Typography & Icons
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
